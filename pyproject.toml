[project]
name = "docqa"
version = "0.1.0"
description = "Question answering over industrial PDF manuals with verifiable citations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic==2.14.2",
    "python-multipart",
    "psycopg[binary]==3.3.6",
    "psycopg-pool",
    "pgvector",
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    "tokenizers==0.23.3",
    "pymupdf==2.0",
    "pymupdf4llm==2.0",
    "google-genai==2.34.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
extend-select = ["ANN", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
